# git-cliff configuration for AniMAL.
# Release notes are generated in CI on tag pushes (see
# .github/workflows/release-apk.yml) and committed back as CHANGELOG.md.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | trim | split(pat="\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}
"""
footer = """
<!-- Generated by git-cliff (https://github.com/orhun/git-cliff) -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Code Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^chore", group = "Chores" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = ".*", group = "Other" },
]
