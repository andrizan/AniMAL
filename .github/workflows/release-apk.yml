name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool/pub
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Regenerate freezed/json_serializable
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  build:
    name: Build APK
    needs: quality
    if: |
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      (needs.quality.result == 'success' || needs.quality.result == 'failure' || needs.quality.result == 'skipped')
    runs-on: ubuntu-latest
    environment: build-config
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool/pub
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Bump pubspec version to match tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z][0-9A-Za-z._]*|[-_][0-9A-Za-z][0-9A-Za-z._-]*)?$'; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "Invalid tag: $GITHUB_REF_NAME. Expected vX.Y.Z, vX.Y.Zsuffix, vX.Y.Z_suffix, or vX.Y.Z-suffix."
              exit 1
            fi
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+\([0-9]*\).*/\1/')
          NEW_BUILD=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${VERSION}+${NEW_BUILD}/" pubspec.yaml
          echo "Version set to ${VERSION}+${NEW_BUILD}"

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Regenerate freezed/json_serializable
        run: dart run build_runner build

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 --no-pub \
            --dart-define=MAL_CLIENT_ID="${{ secrets.MAL_CLIENT_ID }}" \
            --dart-define=MAL_CLIENT_SECRET="${{ secrets.MAL_CLIENT_SECRET }}" \
            --dart-define=MAL_REDIRECT_URI="${{ secrets.MAL_REDIRECT_URI }}"

      - name: Rename APKs
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a; do
            mv "app-${abi}-release.apk" "animal-${{ github.ref_name }}-${abi}.apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: animal-apk
          path: build/app/outputs/flutter-apk/animal-${{ github.ref_name }}-*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: animal-apk
          path: dist

      - name: Verify download
        run: |
          set -euo pipefail
          ls -la dist
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2

      - name: Resolve release metadata
        id: release-metadata
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGES.md

      - name: Regenerate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Create release and upload APKs
        uses: softprops/action-gh-release@v3
        with:
          name: AniMAL ${{ github.ref_name }}
          files: dist/animal-*.apk
          fail_on_unmatched_files: true
          body_path: CHANGES.md
          prerelease: ${{ steps.release-metadata.outputs.prerelease }}

      - name: Commit version bump and changelog back to main
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Read the version currently on main.
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: \([0-9][0-9.]*\).*/\1/')
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Version on main already matches tag ($VERSION). Skipping commit."
            exit 0
          fi
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+\([0-9]*\).*/\1/')
          NEW_BUILD=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${VERSION}+${NEW_BUILD}/" pubspec.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: bump version to ${VERSION}+${NEW_BUILD} [skip ci]"
          git push origin main
